[package]
name = "clipboard-history-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "The ringboard server."
repository.workspace = true
keywords = ["ringboard", "clipboard", "tools", "server"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
license = "AGPL-3.0-only"

[dependencies]
arrayvec = "0.7.8"
bitcode = { version = "0.6.9", features = ["arrayvec"] }
bitvec = "1.1.1"
env_logger = { version = "0.11.11", default-features = false }
error-stack = { version = "0.8.0", default-features = false, features = ["std"] }
io-uring = "0.7.15"
libc = "0.2.190"
log = { version = "0.4.34", features = ["release_max_level_info"] }
ringboard-core = { package = "clipboard-history-core", version = "0", path = "../core", features = ["error-stack"] }
ringboard-sdk = { package = "clipboard-history-client-sdk", version = "0", path = "../client-sdk" }
rustix = { version = "1.1.5", features = ["fs", "process", "net", "io_uring"] }
sd-notify = { version = "0.5.0", optional = true }
smallvec = "2.0.0-beta.2"
thiserror = "2.0.21"
tokio = { version = "1.47", default-features = false, features = ["rt", "macros", "sync"], optional = true }
tracy-client = { version = "0.19.0", optional = true }
zbus = { version = "5.5", default-features = false, features = ["tokio"], optional = true }

[features]
default = ["systemd", "human-logs", "dbus"]
systemd = ["dep:sd-notify"]
human-logs = ["env_logger/default"]
dbus = ["dep:zbus", "dep:tokio", "ringboard-sdk/search"]
trace = ["dep:tracy-client"]

[[bin]]
name = "ringboard-server"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.13"
tokio = { version = "1.47", features = ["macros", "rt", "time"] }
which = "7.0"
zbus = { version = "5.5", default-features = false, features = ["tokio"] }
